help-header: '<dark_gray><strikethrough>        </strikethrough> <gradient:#ff4e00:#ffb000><bold>Fire!</bold></gradient> <gray>v{version} <dark_gray><strikethrough>        </strikethrough>'
help-line: '<#ff7a00>/fire {cmd} <dark_gray>- <gray>{desc}'
