toggled: '{prefix}<gray>Проверка <white>{check} <gray>{state}.'

info-header: '{prefix}<white>{player} <dark_gray>| <gray>Heat <yellow>{heat} <dark_gray>| <gray>Пинг <white>{ping}мс <dark_gray>| <gray>Наблюдение <white>{watch}'
